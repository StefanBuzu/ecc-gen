<svg xmlns="http://www.w3.org/2000/svg" width="780" height="372" viewBox="0 0 780 372" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">
  <rect width="780" height="372" rx="8" fill="#ffffff"/>

  <!-- code word layout -->
  <text x="40" y="24" text-anchor="start" font-size="15" font-weight="bold" fill="#111">SECDED code word for 8 data bits (13 bits)</text>
  <g fill="#555" font-size="12">
    <text x="64" y="46">1</text><text x="116" y="46">2</text><text x="168" y="46">3</text><text x="220" y="46">4</text>
    <text x="272" y="46">5</text><text x="324" y="46">6</text><text x="376" y="46">7</text><text x="428" y="46">8</text>
    <text x="480" y="46">9</text><text x="532" y="46">10</text><text x="584" y="46">11</text><text x="636" y="46">12</text>
    <text x="700" y="46">MSB</text>
  </g>
  <g stroke-width="1.5">
    <rect x="40" y="52" width="48" height="40" rx="4" fill="#fde7c2" stroke="#c77700"/>
    <rect x="92" y="52" width="48" height="40" rx="4" fill="#fde7c2" stroke="#c77700"/>
    <rect x="144" y="52" width="48" height="40" rx="4" fill="#d6e6fb" stroke="#2f6db5"/>
    <rect x="196" y="52" width="48" height="40" rx="4" fill="#fde7c2" stroke="#c77700"/>
    <rect x="248" y="52" width="48" height="40" rx="4" fill="#d6e6fb" stroke="#2f6db5"/>
    <rect x="300" y="52" width="48" height="40" rx="4" fill="#d6e6fb" stroke="#2f6db5"/>
    <rect x="352" y="52" width="48" height="40" rx="4" fill="#d6e6fb" stroke="#2f6db5"/>
    <rect x="404" y="52" width="48" height="40" rx="4" fill="#fde7c2" stroke="#c77700"/>
    <rect x="456" y="52" width="48" height="40" rx="4" fill="#d6e6fb" stroke="#2f6db5"/>
    <rect x="508" y="52" width="48" height="40" rx="4" fill="#d6e6fb" stroke="#2f6db5"/>
    <rect x="560" y="52" width="48" height="40" rx="4" fill="#d6e6fb" stroke="#2f6db5"/>
    <rect x="612" y="52" width="48" height="40" rx="4" fill="#d6e6fb" stroke="#2f6db5"/>
    <rect x="676" y="52" width="48" height="40" rx="4" fill="#d4f0dc" stroke="#2e8b57"/>
  </g>
  <g fill="#111">
    <text x="64" y="77">c0</text><text x="116" y="77">c1</text><text x="168" y="77">d0</text><text x="220" y="77">c2</text>
    <text x="272" y="77">d1</text><text x="324" y="77">d2</text><text x="376" y="77">d3</text><text x="428" y="77">c3</text>
    <text x="480" y="77">d4</text><text x="532" y="77">d5</text><text x="584" y="77">d6</text><text x="636" y="77">d7</text>
    <text x="700" y="77">P</text>
  </g>
  <path d="M40 100 v6 h620 v-6" fill="none" stroke="#555"/>
  <text x="350" y="124" fill="#333">Hamming part: check bits c at positions 1, 2, 4, 8 and data bits d</text>
  <path d="M676 100 v6 h48 v-6" fill="none" stroke="#555"/>
  <text x="700" y="124" fill="#333">parity</text>

  <!-- legend -->
  <g font-size="12" text-anchor="start" fill="#333">
    <rect x="40" y="140" width="14" height="14" rx="2" fill="#fde7c2" stroke="#c77700"/><text x="60" y="152">check bit (Hamming)</text>
    <rect x="200" y="140" width="14" height="14" rx="2" fill="#d6e6fb" stroke="#2f6db5"/><text x="220" y="152">data bit</text>
    <rect x="300" y="140" width="14" height="14" rx="2" fill="#d4f0dc" stroke="#2e8b57"/><text x="320" y="152">overall parity: XOR of all other bits, makes the number of ones even</text>
  </g>

  <!-- decoder decision -->
  <text x="40" y="198" text-anchor="start" font-size="15" font-weight="bold" fill="#111">Decoder decision</text>
  <g stroke="#bbb" stroke-width="1">
    <rect x="190" y="210" width="270" height="30" fill="#f3f4f6"/>
    <rect x="460" y="210" width="280" height="30" fill="#f3f4f6"/>
    <rect x="40" y="240" width="150" height="56" fill="#f3f4f6"/>
    <rect x="40" y="296" width="150" height="56" fill="#f3f4f6"/>
    <rect x="190" y="240" width="270" height="56" fill="#ffffff"/>
    <rect x="460" y="240" width="280" height="56" fill="#e3f4e8"/>
    <rect x="190" y="296" width="270" height="56" fill="#fbd5d5"/>
    <rect x="460" y="296" width="280" height="56" fill="#e3f4e8"/>
  </g>
  <g fill="#111">
    <text x="325" y="230" font-weight="bold">number of ones even</text>
    <text x="600" y="230" font-weight="bold">number of ones odd</text>
    <text x="115" y="273" font-weight="bold">syndrome = 0</text>
    <text x="115" y="329" font-weight="bold">syndrome ≠ 0</text>
    <text x="325" y="273">no error</text>
    <text x="600" y="264">only P flipped, data is fine</text>
    <text x="600" y="284" fill="#2e7d4f">corrected</text>
    <text x="325" y="320">two bits flipped, data is wrong</text>
    <text x="325" y="340" fill="#b42318">uncorrectable</text>
    <text x="600" y="320">one bit flipped: flip position syndrome</text>
    <text x="600" y="340" fill="#2e7d4f">corrected</text>
  </g>
</svg>
